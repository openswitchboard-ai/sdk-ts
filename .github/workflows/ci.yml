name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # sdk-ts consumes @openswitchboard/schema via file:../schema,
      # so check the two repos out side by side.
      - uses: actions/checkout@v4
        with:
          path: sdk-ts
      - uses: actions/checkout@v4
        with:
          repository: openswitchboard-ai/schema
          path: schema
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The conformance run imports the schema package's own suite, so that
      # checkout needs its dependencies too. npm ci installs exactly what each
      # lockfile says, and fails if a lockfile has drifted from its package.
      - run: npm ci
        working-directory: schema
      - run: npm ci
        working-directory: sdk-ts
      - name: Lint (typecheck)
        run: npm run lint
        working-directory: sdk-ts
      - name: Tests (incl. protocol conformance + no-leak proof)
        run: npm test
        working-directory: sdk-ts

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a secret matters wherever it landed, not only in the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action wants a paid licence for organisations; the
      # binary itself is MIT and does the same scan. The tarball is pinned by
      # sha256 so a replaced release asset fails the job instead of running.
      - name: gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .
